[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "kev-experiment-gateway"
version = "0.1.0"
description = "Independent HTTP passthrough and dated request/response capture for Kev experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29", "uvicorn>=0.30,<1", "tzdata>=2024.1"]

[project.scripts]
kev-gateway = "kev_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["kev_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
